[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzle-claude-config"
dynamic = ["version"]
description = "Sync Claude Code configuration across machines (ccs): collect, apply, and bootstrap from a GitHub payload repo"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "djdarcy", email = "djdarcy@users.noreply.github.com"},
]
keywords = ["claude-code", "config", "sync", "dotfiles", "cli", "bootstrap"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/DazzleML/dazzle-claude-config"
Repository = "https://github.com/DazzleML/dazzle-claude-config"
Issues = "https://github.com/DazzleML/dazzle-claude-config/issues"

[project.scripts]
ccs = "dazzle_claude_config.cli:main"
dazzle-claude-config = "dazzle_claude_config.cli:main"

[tool.setuptools.dynamic]
version = {attr = "dazzle_claude_config._version.PIP_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["dazzle_claude_config", "dazzle_claude_config.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.repokit-common]
version-source = "dazzle_claude_config/_version.py"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/DazzleML/dazzle-claude-config"
tag-prefix = "v"
private-patterns = ["private/", "local/", ".env"]
